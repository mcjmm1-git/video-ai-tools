services:
  colorizar:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_CUDA_ARCH_LIST: "${TORCH_CUDA_ARCH_LIST:-8.6}"

    container_name: video-colorizer
    restart: "no"

    gpus: all

    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      TZ: Europe/Madrid

      COLOR_INPUT: "${COLOR_INPUT}"
      COLOR_OUTPUT: "${COLOR_OUTPUT}"

      TEST_START: "${TEST_START:-00:10:00}"
      TEST_DURATION: "${TEST_DURATION:-20}"

      REF_EVERY: "${REF_EVERY:-2}"
      DDCOLOR_SIZE: "${DDCOLOR_SIZE:-512}"

      CMNET_MAX_SIDE: "${CMNET_MAX_SIDE:-512}"
      CMNET_WINDOW: "${CMNET_WINDOW:-20}"
      CMNET_TOP_K: "${CMNET_TOP_K:-20}"
      CMNET_MEM_EVERY: "${CMNET_MEM_EVERY:-10}"

    volumes:
      - ./input:/input:ro
      - ./output:/output
      - ./models:/models
      - ./cache:/root/.cache
      - ./work:/work

    command:
      - /app/pipeline.sh
